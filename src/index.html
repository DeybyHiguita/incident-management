<!doctype html>
<!-- `lang` en español: los lectores de pantalla eligen la voz con este
     atributo, y coincide con el LOCALE_ID de app.config.ts. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Gestión de incidencias</title>
  <meta name="description" content="Sistema de gestión de incidencias técnicas: registro, seguimiento y resolución.">
  <!-- `base href` es lo que permite al enrutador construir las URLs. Si la
       aplicación se sirviera desde un subdirectorio, habría que compilar con
       `ng build --base-href /subdirectorio/`. -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
