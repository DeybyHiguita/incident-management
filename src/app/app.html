<!-- Barra global de actividad. Va fuera del <main> porque no pertenece a
     ninguna pantalla: refleja que hay red en curso, la pida quien la pida. -->
@if (loading()) {
  <div class="global-progress" role="progressbar" aria-label="Cargando" aria-busy="true"></div>
}

<app-header [systemTitle]="systemTitle" [userName]="currentUser().name" />

<main class="app-main" id="main-content" tabindex="-1">
  <div class="app-main-container">
    <router-outlet />
  </div>
</main>

<app-footer />
