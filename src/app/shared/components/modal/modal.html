<dialog #dialog class="modal" (close)="onDialogClose()" (click)="onDialogClick($event)">
  <div class="modal-panel">
    <header class="modal-header">
      <!-- Proyección con selector: quien usa el modal decide el título. -->
      <h2 class="modal-title"><ng-content select="[modalTitle]" /></h2>

      <button
        type="button"
        class="btn btn--icon modal-close"
        [attr.aria-label]="closeLabel()"
        (click)="close()"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    </header>

    <!-- Proyección por defecto: todo lo que no lleve selector cae aquí. -->
    <div class="modal-body">
      <ng-content />
    </div>

    <footer class="modal-actions">
      <ng-content select="[modalActions]" />
    </footer>
  </div>
</dialog>
