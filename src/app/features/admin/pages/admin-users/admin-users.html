<section class="admin-users" aria-labelledby="admin-users-title">
  <h2 id="admin-users-title">Administración de usuarios</h2>

  <p class="admin-users-note">
    Esta página solo es accesible con el rol <strong>ADMIN</strong>.
  </p>

  <div class="admin-users-table-wrapper">
    <table class="admin-users-table">
      <caption class="visually-hidden">Usuarios registrados en el sistema</caption>
      <thead>
        <tr>
          <th scope="col">Nombre</th>
          <th scope="col">Correo</th>
          <th scope="col">Rol</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users; track user.id) {
          <tr>
            <td>
              {{ user.name }}
              @if (user.id === currentUserId()) {
                <span class="admin-users-you">(tú)</span>
              }
            </td>
            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
