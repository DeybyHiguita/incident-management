<section class="incident-list">
  <header class="incident-list__header">
    <h2>Incidencias registradas</h2>
    <button
      type="button"
      class="incident-list__restore"
      [disabled]="isRestoreDisabled()"
      (click)="restoreIncidents()"
    >
      Restaurar lista
    </button>
  </header>

  @if (selectedIncident(); as incident) {
    <p class="incident-list__selection">
      Incidencia seleccionada: <strong>{{ incident.title }}</strong> ({{ incident.id }})
    </p>
  } @else {
    <p class="incident-list__selection incident-list__selection--empty">
      Ninguna incidencia seleccionada.
    </p>
  }

  @for (incident of incidents(); track incident.id) {
    <app-incident-card
      [incident]="incident"
      [selected]="incident.id === selectedId()"
      (incidentSelected)="onIncidentSelected($event)"
      (deleteRequested)="onDeleteRequested($event)"
    />
  } @empty {
    <p class="incident-list__empty">No hay incidencias registradas.</p>
  }
</section>
