<header class="app-header">
  <div class="app-header__bar">
    <h1 class="app-header__title">{{ systemTitle }}</h1>

    <nav class="app-header__nav" aria-label="Navegación principal">
      <ul class="app-header__nav-list">
        <li>
          <a
            class="app-header__nav-link"
            routerLink="/incidents"
            routerLinkActive="app-header__nav-link--active"
          >
            Incidencias
          </a>
        </li>
      </ul>
    </nav>

    <!-- La misma directiva de foco que usa la tarjeta, en otro componente. -->
    <div class="app-header__user" appFocusWithin>
      <span class="app-header__user-name">{{ userName }}</span>
      <button
        type="button"
        class="btn app-header__toggle"
        id="user-details-toggle"
        [attr.aria-expanded]="showUserDetails()"
        aria-controls="user-details"
        (click)="toggleUserDetails()"
      >
        {{ showUserDetails() ? 'Ocultar detalles' : 'Mostrar detalles' }}
      </button>
    </div>
  </div>

  @if (showUserDetails()) {
    <p class="app-header__details" id="user-details">Sesión simulada de: {{ userName }}</p>
  }
</header>
