# Despliegue en Netlify.

[build]
  command = "npm run build"
  publish = "dist/incident-management/browser"

# Cabeceras de seguridad (riesgo R-05 de docs/riesgos-conocidos.md).
# Las emite el servidor, no la aplicación, así que este es su sitio.
[[headers]]
  for = "/*"
  [headers.values]
    # Impide que la aplicación se cargue dentro de un iframe ajeno.
    X-Frame-Options = "DENY"
    # Evita que el navegador adivine el tipo de contenido.
    X-Content-Type-Options = "nosniff"
    # Fuerza HTTPS durante un año.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # No filtra la ruta completa al navegar a otro sitio.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Acota el daño de un XSS: solo se ejecuta lo que venga de este origen.
    # `unsafe-inline` en estilos es necesario porque Angular inserta los
    # estilos de componente en línea.
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Los archivos con hash en el nombre no cambian nunca: se cachean para
# siempre. index.html sí cambia, así que no se cachea.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
